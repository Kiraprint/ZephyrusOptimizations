# ASPM boot parameters for maximum power savings
# Install to: /etc/limine-entry-tool.d/aspm.conf
#
# pcie_aspm.policy=         — Set initial (boot) policy (runtime-switchable via sysfs)
#   powersave               → enable ASPM where BIOS allows it; battery-first boot default
#   NOTE: do NOT use pcie_aspm=force here — forcing L1 substates on devices the BIOS
#         left disabled caused PCIe link instability with the RTX 5090 GSP firmware.
#   AC performance is applied at runtime by power-switch-unified.sh (sets policy=performance)
#
# After installing, regenerate boot config:
#   sudo limine-entry-tool --add-kernel linux-cachyos ...  # or just reboot
#
# To verify after reboot:
#   cat /sys/module/pcie_aspm/parameters/policy
#   lspci -vv | grep -E "ASPM L1 Enabled"
#
# To switch at runtime (AC/battery):
#   sudo ./power-switch-unified.sh ac       # performance
#   sudo ./power-switch-unified.sh battery  # powersupersave
KERNEL_CMDLINE[default]+="pcie_aspm.policy=powersave"
