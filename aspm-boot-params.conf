# ASPM boot parameters for maximum power savings
# Install to: /etc/limine-entry-tool.d/aspm.conf
#
# pcie_aspm=force           — Enable ASPM even on devices where BIOS disabled it
# pcie_aspm.policy=         — Set initial policy (runtime-switchable via sysfs)
#   powersupersave          → deepest L1 substates (L1.1/L1.2) for battery
#   Performance at AC is handled by power-switch-unified.sh at runtime
#
# After installing, regenerate boot config:
#   sudo limine-entry-tool --add-kernel linux-cachyos ...  # or just reboot
#
# To verify after reboot:
#   cat /sys/module/pcie_aspm/parameters/policy
#   lspci -vv | grep -E "ASPM L1 Enabled"
#
# To switch at runtime (AC/battery):
#   sudo ./power-switch-unified.sh ac       # performance
#   sudo ./power-switch-unified.sh battery  # powersupersave
KERNEL_CMDLINE[default]+="pcie_aspm=force pcie_aspm.policy=powersupersave"
