# nvidia-powerd-guard.conf — systemd drop-in for nvidia-powerd.
#
# Install to: /etc/systemd/system/nvidia-powerd.service.d/guard.conf
# Replaces nvidia-powerd with a guard wrapper that only starts the real
# daemon when the dGPU is on the bus. Prevents the hard freeze caused by
# NVML attach to a D3cold-removed device (see nvidia-powerd-guard.sh).
[Service]
ExecStart=
ExecStart=/usr/local/bin/nvidia-powerd-guard
